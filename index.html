<title>KL Travel trip</title>
<!--
  KL Travel web trip, version 2 (app 5.4.1+). For people without the app: Share > "Share a web link" sends
  https://poleman16ft-dev.github.io/KLTravel/?s=<sheet id>&t=<trip name>&f=<sender>
  Looks like the app: its colours, Material icons, the timeline rows and a detail view per item, with Plan / Stays /
  Transport tabs. Reads the trip's Google Sheet (shared "Anyone with the link: Viewer") live from Google.
  Pictures and weather need no keys: Wikipedia (city, hotel and place photos), Wikimedia Commons (the airline's plane,
  like the app's Transport photos), Open-Meteo (weather, like the app). Maps are Google's keyless embed, loaded only
  when a map is opened. Costs are never shown. Nothing is stored except a small photo-lookup cache in this browser.
  Host: GitHub Pages, repo poleman16ft-dev/KLTravel, branch main, folder / (root).
-->

<style>
/* The app's colour scheme (ui/Theme.kt). */
:root {
  --primary: #1F3864; --on-primary: #FFFFFF; --primary-container: #D6E4FF; --on-primary-container: #0B1F44;
  --secondary: #0277BD; --tertiary: #00897B;
  --bg: #F7F8FA; --surface: #FFFFFF; --surface-variant: #E9EDF4; --ink: #1A1C20; --muted: #5B6472; --line: #E1E5EC;
  --today: #FFF4D6; --today-ink: #6B4E00; --warn-bg: #FDECEA; --warn-ink: #8A1C12; --scrim: rgba(10, 18, 36, .58);
  --accent: var(--primary); --link: var(--secondary);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #9DBDFF; --on-primary: #0B1F44; --primary-container: #243B6B; --on-primary-container: #D6E4FF;
    --secondary: #4FC3F7; --tertiary: #4DB6AC;
    --bg: #10141B; --surface: #171C25; --surface-variant: #232A36; --ink: #E3E7EF; --muted: #A3ADBD; --line: #273041;
    --today: #3A3216; --today-ink: #FFDF8E; --warn-bg: #3A1714; --warn-ink: #FFB4A9; --scrim: rgba(6, 9, 14, .62);
  }
}
:root[data-theme="dark"] {
  --primary: #9DBDFF; --on-primary: #0B1F44; --primary-container: #243B6B; --on-primary-container: #D6E4FF;
  --secondary: #4FC3F7; --tertiary: #4DB6AC;
  --bg: #10141B; --surface: #171C25; --surface-variant: #232A36; --ink: #E3E7EF; --muted: #A3ADBD; --line: #273041;
  --today: #3A3216; --today-ink: #FFDF8E; --warn-bg: #3A1714; --warn-ink: #FFB4A9; --scrim: rgba(6, 9, 14, .62);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--link); }
button { font: inherit; color: inherit; }
.ms { display: inline-block; width: 24px; height: 24px; flex: none; vertical-align: middle; line-height: 0; font-size: 24px; color: inherit; }
.ms svg { width: 100%; height: 100%; fill: currentColor; display: block; }
.ms:not([data-icon]) { visibility: hidden; overflow: hidden; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }

/* top app bar */
.appbar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding-top: env(safe-area-inset-top); border-bottom: 1px solid transparent; transition: border-color .2s;
}
.appbar.scrolled { border-bottom-color: var(--line); }
.appbar .wrap { display: flex; align-items: center; gap: 4px; min-height: 60px; }
.appbar h1 { flex: 1; min-width: 0; margin: 0; font-size: 22px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; cursor: pointer;
  display: inline-grid; place-items: center; color: var(--ink);
}
.icon-btn:hover { background: var(--surface-variant); }
.icon-btn[disabled] .ms { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* hero */
.hero {
  position: relative; border-radius: 24px; overflow: hidden; margin: 4px 0 0; min-height: 200px;
  background: linear-gradient(135deg, var(--primary-container), var(--surface-variant));
  display: flex; align-items: flex-end; isolation: isolate;
}
.hero .img { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity .5s; z-index: -2; }
.hero .img.loaded { opacity: 1; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 20%, var(--scrim)); opacity: 0; transition: opacity .5s; }
.hero.has-photo::before { opacity: 1; }
.hero .txt { padding: 18px 18px 16px; color: var(--on-primary-container); width: 100%; }
.hero.has-photo .txt { color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.35); }
.hero .name { font-size: 28px; line-height: 1.15; font-weight: 500; margin: 0; overflow-wrap: anywhere; }
.hero .dates { margin: 6px 0 0; font-size: 15px; opacity: .95; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; line-height: 1;
  padding: 7px 11px; border-radius: 999px; background: var(--surface); color: var(--ink); text-shadow: none;
}
.chip .ms { width: 18px; height: 18px; color: var(--primary); }
.hero .credit { position: absolute; right: 10px; top: 8px; font-size: 10px; color: #fff; opacity: .75; text-decoration: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); max-width: 60%; text-align: right; }

/* tabs */
.tabs {
  position: sticky; z-index: 15; background: var(--bg); display: flex; gap: 8px; padding: 12px 0 10px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 10px;
  padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 500; font-size: 14px; color: var(--ink); flex: none;
}
.tab .ms { width: 20px; height: 20px; }
.tab[aria-selected="true"] { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }
.tab .n { font-size: 12px; opacity: .75; }
.status { font-size: 13px; color: var(--muted); margin: 0 0 4px; min-height: 18px; }

/* timeline: same rows as the app */
.day { margin-top: 18px; scroll-margin-top: 130px; }
.dayhead { display: flex; align-items: center; gap: 10px; margin: 0 0 2px; padding: 6px 0; }
.dayhead h2 { margin: 0; flex: 1; font-size: 15px; font-weight: 500; color: var(--primary); }
.dayhead .wx { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.dayhead .wx .ms { width: 20px; height: 20px; color: var(--secondary); }
.day + .day { border-top: 3px solid var(--line); padding-top: 8px; }
.row { border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row > button {
  display: grid; grid-template-columns: 78px 32px 1fr 24px; align-items: start; gap: 0 10px; width: 100%;
  text-align: left; background: none; border: 0; padding: 14px 0; cursor: pointer; border-radius: 8px;
}
.row > button:hover .title { text-decoration: underline; text-decoration-color: var(--line); }
.row .time { font-size: 14px; color: var(--ink); padding-top: 3px; white-space: nowrap; }
.row .time small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.row .ico { color: var(--primary); padding-top: 1px; }
.row .title { font-size: 18px; line-height: 1.3; overflow-wrap: anywhere; }
.row .subtitle { font-size: 14px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.row .chev { color: var(--muted); transition: transform .2s; padding-top: 3px; }
.row.open .chev { transform: rotate(180deg); }
.detail { display: none; padding: 0 0 16px 120px; }
.row.open .detail { display: block; }
@media (max-width: 480px) {
  .row > button { grid-template-columns: 66px 28px 1fr 22px; gap: 0 8px; }
  .row .title { font-size: 17px; }
  .detail { padding-left: 0; }
}

/* detail pieces (rows, stays, transport) */
.photo { position: relative; border-radius: 16px; overflow: hidden; background: var(--surface-variant); aspect-ratio: 16 / 9; margin-bottom: 12px; display: none; }
.photo.loaded { display: block; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 6px; font-size: 11px; color: #fff; background: linear-gradient(180deg, transparent, rgba(0,0,0,.55)); }
.photo figcaption b { display: block; font-size: 13px; font-weight: 500; }
.photo figcaption a { color: #fff; opacity: .85; text-decoration: none; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0 0 12px; font-size: 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.notes { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; margin: 0 0 12px; background: var(--surface-variant); border-radius: 12px; padding: 10px 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none; cursor: pointer; border: 1px solid var(--line);
  background: transparent; color: var(--primary); font-weight: 500; font-size: 14px; border-radius: 999px; padding: 8px 14px; min-height: 40px;
}
.btn .ms { width: 18px; height: 18px; }
.btn.filled { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.map { width: 100%; height: 240px; border: 0; border-radius: 16px; margin-top: 12px; background: var(--surface-variant); display: block; }

/* cards (stays, transport) */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; margin: 12px 0; }
.card .photo { margin: -14px -14px 12px; border-radius: 20px 20px 0 0; }
.card h3 { margin: 0; font-size: 19px; font-weight: 500; display: flex; gap: 8px; align-items: flex-start; overflow-wrap: anywhere; }
.card h3 .ms { color: var(--primary); margin-top: 1px; }
.card .when { color: var(--muted); font-size: 14px; margin: 4px 0 10px 32px; }
.card .facts, .card .notes, .card .actions { margin-left: 32px; }
@media (max-width: 480px) { .card .facts, .card .notes, .card .actions, .card .when { margin-left: 0; } }

.state { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-top: 16px; }
.state.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.state h2 { font-size: 18px; margin: 0 0 6px; }
.state ol { padding-left: 20px; margin: 8px 0 0; }
.empty { color: var(--muted); padding: 24px 4px; text-align: center; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--primary); border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; vertical-align: -4px; margin-right: 8px; }
.skeleton { height: 64px; border-radius: 12px; background: var(--surface-variant); margin: 12px 0; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
footer { margin: 40px 0 calc(32px + env(safe-area-inset-bottom)); font-size: 13px; color: var(--muted); text-align: center; }
footer .btn { margin-top: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="appbar" id="appbar"><div class="wrap">
  <h1 id="barTitle">KL Travel</h1>
  <button class="icon-btn" id="share" type="button" aria-label="Share this page" hidden><span class="ms">share</span></button>
  <button class="icon-btn" id="refresh" type="button" aria-label="Refresh" hidden><span class="ms">sync</span></button>
</div></header>
<main class="wrap">
  <section class="hero" id="hero">
    <div class="img" id="heroImg"></div>
    <a class="credit" id="heroCredit" hidden target="_blank" rel="noopener"></a>
    <div class="txt">
      <p class="name" id="tripName">Trip</p>
      <p class="dates" id="tripDates"></p>
      <div class="chips" id="chips"></div>
    </div>
  </section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Trip" hidden>
    <button class="tab" role="tab" type="button" data-tab="plan" aria-selected="true"><span class="ms">view_timeline</span>Plan</button>
    <button class="tab" role="tab" type="button" data-tab="stays" aria-selected="false"><span class="ms">hotel</span>Stays <span class="n" id="nStays"></span></button>
    <button class="tab" role="tab" type="button" data-tab="transport" aria-selected="false"><span class="ms">flight</span>Transport <span class="n" id="nTransport"></span></button>
  </nav>
  <p class="status" id="updated" aria-live="polite"></p>
  <div id="content"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  <footer>
    Live from the trip's Google Sheet. Updates by itself every few minutes.<br>
    Photos: Wikipedia and Wikimedia Commons · Weather: Open-Meteo<br>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.kl.travel" rel="noopener"><span class="ms">android</span>Get KL Travel for Android</a>
  </footer>
</main>

      '<button type="button" aria-expanded="' + open + '">' +
        '<span class="time">' + (e.start != null ? esc(fmtTime(e.start)) : "All day") + (e.end != null ? "<small>to " + esc(fmtTime(e.end)) + "</small>" : "") + "</span>" +
        '<span class="ms ico" aria-hidden="true">' + iconFor(e) + "</span>" +
        '<span><span class="title">' + esc(e.title) + "</span>" + (sub ? '<span class="subtitle" style="display:block">' + esc(sub) + "</span>" : "") + "</span>" +
        '<span class="ms chev" aria-hidden="true">expand_more</span>' +
      "</button>" +
      '<div class="detail">' + eventDetail(e) + "</div></div>";
  }
  function stayRows(list) {
    var out = [];
    list.forEach(function (h) {
      out.push({ id: h.id + "i", kind: "in", stay: h, date: h.inDate, start: h.inTime, end: null, type: "Check-in", title: "Check in: " + h.name,
        location: h.name, address: h.address, flight: "", confirmation: h.confirmation, transport: "", notes: "", seat: "", cabin: "", aircraft: "" });
      if (h.outDate) out.push({ id: h.id + "o", kind: "out", stay: h, date: h.outDate, start: h.outTime, end: null, type: "Check-out", title: "Check out: " + h.name,
        location: h.name, address: h.address, flight: "", confirmation: "", transport: "", notes: "", seat: "", cabin: "", aircraft: "" });
    });
    return out;
  }
  function allItems() {
    return state.evts.concat(stayRows(state.hotels)).sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.start == null ? -1 : a.start) - (b.start == null ? -1 : b.start);
    });
  }
  function findItem(id) {
    var all = allItems(); for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i].kind === "event" ? all[i] : all[i].stay;
    for (var j = 0; j < state.hotels.length; j++) if (state.hotels[j].id === id) return state.hotels[j];
    return null;
  }

  function renderPlan() {
    var today = todayStr(), all = allItems(), byDay = {}, order = [];
    all.forEach(function (e) { if (!byDay[e.date]) { byDay[e.date] = []; order.push(e.date); } byDay[e.date].push(e); });
    if (!order.length) return '<p class="empty">Nothing planned yet. Check back soon.</p>';
    return order.map(function (d) {
      return '<section class="day' + (d === today ? " today" : "") + '" id="d' + d + '" data-date="' + d + '">' +
        '<div class="dayhead"><h2>' + esc(dayLabel(d, today)) + '</h2><span class="wx" data-wx="' + d + '"></span></div>' +
        byDay[d].map(function (e) { return rowHtml(e, today); }).join("") + "</section>";
    }).join("");
  }
  function stayCard(h) {
    var nights = h.outDate ? daysBetween(h.inDate, h.outDate) : null;
    var fmt = { weekday: "short", month: "short", day: "numeric" };
    var when = fmtDay(h.inDate, fmt) + (h.inTime != null ? " " + fmtTime(h.inTime) : "") +
      (h.outDate ? " → " + fmtDay(h.outDate, fmt) + (h.outTime != null ? " " + fmtTime(h.outTime) : "") : "") +
      (nights > 0 ? " · " + nights + (nights === 1 ? " night" : " nights") : "");
    var extra = [];
    var tel = h.phone.replace(/[^0-9+]/g, "");
    if (tel.length >= 6) extra.push('<a class="btn" href="tel:' + esc(tel) + '"><span class="ms">call</span>Call</a>');
    var web = safeUrl(h.website);
    if (web) extra.push('<a class="btn" href="' + esc(web) + '" target="_blank" rel="noopener"><span class="ms">language</span>Website</a>');
    return '<article class="card" data-id="' + h.id + '"><figure class="photo" data-id="' + h.id + '" data-kind="stay"></figure>' +
      '<h3><span class="ms">hotel</span><span>' + esc(h.name) + "</span></h3>" +
      '<p class="when">' + esc(when) + "</p>" +
      '<dl class="facts">' + fact("Address", h.address) + fact("Confirmation", h.confirmation) + fact("Phone", h.phone) + "</dl>" +
      (h.notes ? '<p class="notes">' + esc(h.notes) + "</p>" : "") +
      '<div class="actions">' + actions(h.address || h.name, extra).join("") + "</div></article>";
  }
  function transportCard(e) {
    var when = fmtDay(e.date, { weekday: "short", month: "short", day: "numeric" }) + (e.start != null ? " · " + fmtTime(e.start) : "") + (e.end != null ? " – " + fmtTime(e.end) : "");
    var extra = [];
    if (e.flight) extra.push('<a class="btn" href="https://www.google.com/search?q=' + encodeURIComponent(e.flight + " flight status") + '" target="_blank" rel="noopener"><span class="ms">flight_takeoff</span>Flight status</a>');
    var air = airlineName(e.flight);
    return '<article class="card" data-id="' + e.id + '"><figure class="photo" data-id="' + e.id + '" data-kind="transport"></figure>' +
      '<h3><span class="ms">' + iconFor(e) + "</span><span>" + esc(e.title) + "</span></h3>" +
      '<p class="when">' + esc(when) + "</p>" +
      '<dl class="facts">' + fact("Flight", e.flight ? e.flight + (air ? " · " + air : "") : "") + fact("Cabin", e.cabin) + fact("Seat", e.seat) +
        fact("Aircraft", e.aircraft) + fact("From", e.location) + fact("Getting there", e.transport) + fact("Confirmation", e.confirmation) + "</dl>" +
      (e.notes ? '<p class="notes">' + esc(e.notes) + "</p>" : "") +
      '<div class="actions">' + actions(e.address || e.location, extra).join("") + "</div></article>";
  }
  function render() {
    var c = $("content"), today = todayStr();
    var tr = state.evts.filter(isTransport);
    $("nStays").textContent = state.hotels.length ? state.hotels.length : "";
    $("nTransport").textContent = tr.length ? tr.length : "";
    if (state.tab === "stays") c.innerHTML = state.hotels.length ? state.hotels.map(stayCard).join("") : '<p class="empty">No stays on this trip yet.</p>';
    else if (state.tab === "transport") c.innerHTML = tr.length ? tr.map(transportCard).join("") : '<p class="empty">No flights or transport on this trip yet.</p>';
    else c.innerHTML = renderPlan();
    c.querySelectorAll(".row.open figure.photo").forEach(loadFig);
    watchFigs(c);
    paintWeather();
    document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.tab === state.tab)); });
    return today;
  }
  function heroAndChips() {
    var all = allItems(), first = all.length ? all[0].date : null, last = all.length ? all[all.length - 1].date : null, today = todayStr();
    $("tripName").textContent = tripName || (first ? "Trip " + fmtDay(first, { month: "short", day: "numeric" }) : "Trip");
    $("barTitle").textContent = tripName || "KL Travel trip";
    $("tripDates").textContent = first ? fmtDay(first, { month: "short", day: "numeric" }) +
      (last !== first ? " – " + fmtDay(last, { month: "short", day: "numeric", year: "numeric" }) : ", " + dateObj(first).getFullYear()) : "";
    var chips = [];
    if (first) {
      if (today < first) { var n = daysBetween(today, first); chips.push(["schedule", n === 1 ? "Starts tomorrow" : "Starts in " + n + " days"]); }
      else if (today <= last) chips.push(["today", "Day " + (daysBetween(first, today) + 1) + " of " + (daysBetween(first, last) + 1)]);
      else chips.push(["task_alt", "Trip ended"]);
    }
    var nf = state.evts.filter(isFlight).length;
    if (nf) chips.push(["flight", nf + (nf === 1 ? " flight" : " flights")]);
    if (state.hotels.length) chips.push(["hotel", state.hotels.length + (state.hotels.length === 1 ? " stay" : " stays")]);
    if (sender) chips.push(["person", "Shared by " + sender]);
    $("chips").innerHTML = chips.map(function (c) { return '<span class="chip"><span class="ms">' + c[0] + "</span>" + esc(c[1]) + "</span>"; }).join("");
    var main = mainCity(state.evts, state.hotels);
    state.main = main;
    if (main && !state.heroFor || main && state.heroFor !== main.name) {
      state.heroFor = main.name;
      cityPhoto(main).then(function (p) {
        if (!p) return;
        var im = new Image(); im.onload = function () {
          var el = $("heroImg"); el.style.backgroundImage = 'url("' + p.src.replace(/"/g, "") + '")'; el.classList.add("loaded"); $("hero").classList.add("has-photo");
          var cr = $("heroCredit"); cr.textContent = p.label + " · " + p.credit; if (p.page) cr.href = p.page; cr.hidden = false;
        }; im.src = p.src;
      });
    }
  }
  var wxByCity = {};
  function paintWeather() {
    var spots = document.querySelectorAll("[data-wx]"); if (!spots.length) return;
    spots.forEach(function (el) {
      var d = el.dataset.wx, city = cityForDay(d, state.hotels, state.main); if (!city) return;
      if (d < todayStr() || daysBetween(todayStr(), d) > 15) return;
      var key = city.name + (city.us ? "|US" : "");
      (wxByCity[key] = wxByCity[key] || forecast(city)).then(function (f) {
        var w = f && f[d]; if (!w) return; var ic = wxIcon(w.code);
        el.innerHTML = (ic ? '<span class="ms" aria-hidden="true">' + ic[1] + "</span>" : "") + esc(w.hi + "° / " + w.lo + "°");
        el.title = (ic ? ic[2] + ", " : "") + "high " + w.hi + "°, low " + w.lo + "° in " + city.name;
      });
    });
  }

  function showError(kind) {
    if (state.loaded) { $("updated").textContent = "Couldn't refresh just now. Showing the last version."; return; }
    var msg = kind === "private"
      ? "<h2>This trip isn't shared yet</h2>Ask " + (sender ? esc(sender) : "the person who sent it") +
        " to share their trip sheet by link:<ol><li>Open the trip's Google Sheet.</li><li>Share &gt; General access &gt; <b>Anyone with the link</b> &gt; Viewer.</li><li>Tap Done, then reload this page.</li></ol>"
      : kind === "format" ? "<h2>This doesn't look like a KL Travel trip sheet</h2>The sheet needs an Events tab with Date and Title columns."
      : "<h2>Couldn't load the trip</h2>Check your connection and tap Refresh.";
    $("content").innerHTML = '<div class="state warn" role="alert">' + msg + "</div>";
  }
  function tick() {
    if (!lastLoaded) return;
    var m = Math.round((Date.now() - lastLoaded) / 60000);
    $("updated").textContent = "Updated " + (m < 1 ? "just now" : m === 1 ? "1 min ago" : m < 60 ? m + " min ago" : new Date(lastLoaded).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
  }
  function load() {
    if (loading) return; loading = true; $("refresh").disabled = true;
    var ev = gviz("Events").then(events);
    var lo = gviz("Lodging").then(stays).catch(function () { return gviz("Hotels").then(stays); }).catch(function () { return []; });
    Promise.all([ev, lo]).then(function (r) {
      var first = !state.loaded;
      state.evts = r[0]; state.hotels = r[1]; state.loaded = true;
      lastLoaded = Date.now(); $("tabs").hidden = false; $("refresh").hidden = false; $("share").hidden = false;
      heroAndChips(); render(); tick();
      if (first && state.tab === "plan" && !location.hash) {
        var t = document.querySelector(".day.today");
        if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 120 });
      }
    }).catch(function (e) {
      var why = (e && (e.reason || e.message)) || "";
      showError(/access|denied|blocked|permission|login|sign/i.test(why) ? "private" : /headers|invalid_query|sheet/i.test(why) ? "format" : "network");
    }).then(function () { loading = false; $("refresh").disabled = false; });
  }

  // ---------------------------------------------------------------- start
  if (tripName) { $("tripName").textContent = tripName; $("barTitle").textContent = tripName; document.title = tripName + " · KL Travel"; }
  if (!/^[A-Za-z0-9_-]{20,}$/.test(sheetId)) {
    $("tripName").textContent = "KL Travel"; $("barTitle").textContent = "KL Travel";
    $("content").innerHTML = '<div class="state"><h2>Open a trip link</h2>This page shows a trip someone shared from the KL Travel app. ' +
      "Open the full link they sent you (it ends in <code>?s=…</code>).</div>";
    return;
  }
  $("content").addEventListener("click", function (ev) {
    var mapBtn = ev.target.closest("[data-map]");
    if (mapBtn) {
      var holder = mapBtn.closest(".detail, .card"), ex = holder.querySelector("iframe.map");
      if (ex) { ex.remove(); mapBtn.lastChild.textContent = "Show map"; return; }
      var f = document.createElement("iframe"); f.className = "map"; f.loading = "lazy"; f.referrerPolicy = "no-referrer-when-downgrade";
      f.title = "Map of " + mapBtn.dataset.map; f.src = embedQ(mapBtn.dataset.map);
      holder.appendChild(f); mapBtn.lastChild.textContent = "Hide map"; return;
    }
    var btn = ev.target.closest(".row > button"); if (!btn) return;
    var row = btn.parentElement, id = row.dataset.id, open = !row.classList.contains("open");
    row.classList.toggle("open", open); btn.setAttribute("aria-expanded", String(open));
    if (open) { state.open[id] = 1; var fig = row.querySelector("figure.photo"); if (fig) loadFig(fig); } else delete state.open[id];
  });
  $("tabs").addEventListener("click", function (ev) {
    var t = ev.target.closest(".tab"); if (!t || t.dataset.tab === state.tab) return;
    state.tab = t.dataset.tab; render();
    window.scrollTo({ top: Math.min(window.scrollY, $("tabs").offsetTop - 60) });
  });
  $("refresh").addEventListener("click", load);
  $("share").addEventListener("click", function () {
    var data = { title: document.title, url: location.href };
    if (navigator.share) navigator.share(data).catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function () { toast("Link copied"); }, function () { toast("Copy the address bar to share"); });
  });
  window.addEventListener("scroll", function () {
    $("appbar").classList.toggle("scrolled", window.scrollY > 4);
  }, { passive: true });
  function placeTabs() { $("tabs").style.top = $("appbar").offsetHeight + "px"; }
  window.addEventListener("resize", placeTabs); placeTabs();
  load();
  setInterval(load, REFRESH_MS);
  setInterval(tick, 30000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && lastLoaded && Date.now() - lastLoaded > 60000) load(); });
})();
</script>
</body>
</html>
