<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="kltravel-web-version" content="1">
<title>KL Travel trip</title>
<!--
  KL Travel web trip (app 5.4.0+). For people without the app: the app's Share > "Share a web link" sends
  https://poleman16ft-dev.github.io/KLTravel/?s=<sheet id>&t=<trip name>&f=<sender>
  This page reads the trip's Google Sheet (shared "Anyone with the link: Viewer") straight from Google every time it
  opens and every few minutes, so it always shows the latest plan. Nothing is stored or sent anywhere else; no keys.
  Costs are never shown. Host: GitHub Pages, repo poleman16ft-dev/KLTravel, branch main, folder / (root).
-->
<style>
:root {
  --bg: #f7f8fa; --card: #ffffff; --ink: #14181f; --muted: #5b6472; --line: #e3e7ee;
  --brand: #1f3864; --brand-ink: #ffffff; --accent: #0277bd; --soft: #e9eef8; --today: #fff6dc; --today-line: #f0c64a;
  --warn-bg: #fdecea; --warn-ink: #8a1c12;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141b; --card: #171c25; --ink: #e8ecf3; --muted: #9aa4b5; --line: #263042;
    --brand: #9dbdff; --brand-ink: #0b1f44; --accent: #4fc3f7; --soft: #1e2736; --today: #2a2717; --today-line: #a88a2c;
    --warn-bg: #3a1714; --warn-ink: #ffb4a9;
  }
}
:root[data-theme="dark"] {
  --bg: #10141b; --card: #171c25; --ink: #e8ecf3; --muted: #9aa4b5; --line: #263042;
  --brand: #9dbdff; --brand-ink: #0b1f44; --accent: #4fc3f7; --soft: #1e2736; --today: #2a2717; --today-line: #a88a2c;
  --warn-bg: #3a1714; --warn-ink: #ffb4a9;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
a { color: var(--accent); }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }
header.top { background: var(--brand); color: var(--brand-ink); }
header.top .wrap { padding-top: 20px; padding-bottom: 18px; }
.kicker { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; opacity: .8; margin: 0; }
h1 { font-size: 26px; line-height: 1.2; margin: 4px 0 6px; overflow-wrap: anywhere; }
.sub { margin: 0; font-size: 14px; opacity: .9; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0 4px; font-size: 14px; color: var(--muted); }
.bar button {
  font: inherit; font-weight: 600; color: var(--accent); background: var(--soft); border: 0; border-radius: 999px;
  padding: 8px 14px; cursor: pointer; min-height: 40px;
}
.bar button[disabled] { opacity: .6; cursor: default; }
nav.days { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 6px; scrollbar-width: none; }
nav.days::-webkit-scrollbar { display: none; }
nav.days a {
  flex: 0 0 auto; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 6px 12px; font-size: 14px; text-align: center; min-width: 64px;
}
nav.days a b { display: block; font-size: 16px; }
nav.days a.is-today { border-color: var(--today-line); background: var(--today); }
section.day { margin-top: 22px; scroll-margin-top: 12px; }
h2 { font-size: 17px; margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
h2 .tag { font-size: 12px; font-weight: 700; background: var(--today-line); color: #1d1600; border-radius: 6px; padding: 1px 7px; }
h3 { font-size: 17px; margin: 28px 0 8px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px;
  display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px;
}
.card.today { border-color: var(--today-line); }
.time { font-weight: 700; font-size: 15px; white-space: nowrap; }
.time small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.body { min-width: 0; }
.title { font-weight: 650; overflow-wrap: anywhere; }
.type { display: inline-block; font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 6px; padding: 0 6px; margin-right: 6px; vertical-align: 1px; }
.meta { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.meta div { margin-top: 2px; }
.links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 14px; }
.links a { font-weight: 600; text-decoration: none; padding: 4px 0; }
.notes { margin-top: 6px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.state { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 18px; }
.state.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.state h2 { font-size: 18px; }
.state ol { padding-left: 20px; margin: 8px 0 0; }
footer { margin-top: 36px; font-size: 13px; color: var(--muted); text-align: center; }
footer .get { display: inline-block; margin-top: 8px; font-weight: 700; text-decoration: none; background: var(--soft); border-radius: 999px; padding: 10px 16px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; }
@keyframes s { to { transform: rotate(360deg); } }
@media (max-width: 380px) { .card { grid-template-columns: 56px 1fr; } h1 { font-size: 22px; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <p class="kicker">KL Travel trip</p>
  <h1 id="tripName">Trip</h1>
  <p class="sub" id="from"></p>
</div></header>
<main class="wrap">
  <div class="bar" id="bar" hidden>
    <span id="updated" aria-live="polite"></span>
    <button type="button" id="refresh">Refresh</button>
  </div>
  <nav class="days" id="days" aria-label="Days"></nav>
  <div id="content"><div class="state"><span class="spin"></span> Loading the trip…</div></div>
  <footer>
    Live from the trip's Google Sheet. Updates by itself every few minutes.<br>
    <a class="get" href="https://play.google.com/store/apps/details?id=com.kl.travel" rel="noopener">Get KL Travel for Android</a>
  </footer>
</main>
<script>
(function () {
  "use strict";
  var REFRESH_MS = 5 * 60 * 1000;
  var params = new URLSearchParams(location.search);
  var sheetId = (params.get("s") || "").trim();
  var tripName = (params.get("t") || "").trim().slice(0, 80);
  var sender = (params.get("f") || "").trim().slice(0, 40);
  var $ = function (id) { return document.getElementById(id); };
  var lastLoaded = null, loading = false, haveData = false;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function norm(h) { return String(h || "").toLowerCase().replace(/[^a-z0-9#]/g, ""); }

  // ---- reading the sheet (Google's public JSONP endpoint; works for "Anyone with the link: Viewer") ----
  var cbN = 0;
  function gviz(tab) {
    return new Promise(function (resolve, reject) {
      var cb = "__klt" + (++cbN) + "_" + Date.now();
      var s = document.createElement("script");
      var done = false;
      var timer = setTimeout(function () { finish(); reject(new Error("timeout")); }, 20000);
      function finish() { done = true; clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); }
      window[cb] = function (resp) { if (done) return; finish(); resolve(resp); };
      s.onerror = function () { if (done) return; finish(); reject(new Error("blocked")); };
      // A sheet that isn't shared by link answers with Google's sign-in page instead of data: the script "loads"
      // but never calls back. (Callbacks run while the script runs, so by onload a real answer has arrived.)
      s.onload = function () { if (done) return; finish(); reject(new Error("blocked")); };
      s.src = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(sheetId) +
        "/gviz/tq?tqx=out:json;responseHandler:" + cb + "&headers=1&sheet=" + encodeURIComponent(tab) + "&_=" + Date.now();
      document.head.appendChild(s);
    });
  }

  function cellText(c) {
    if (!c) return "";
    if (c.f != null && c.f !== "") return String(c.f);
    if (c.v == null) return "";
    return String(c.v);
  }
  // Turns a gviz table into objects keyed by normalized header, keeping the raw cell too.
  function rowsOf(resp) {
    if (!resp || resp.status === "error" || !resp.table) {
      var r = resp && resp.errors && resp.errors[0];
      var err = new Error((r && (r.detailed_message || r.message || r.reason)) || "error");
      err.reason = r && r.reason; throw err;
    }
    var cols = resp.table.cols.map(function (c) { return norm(c.label); });
    var rows = resp.table.rows.map(function (r) { return r.c || []; });
    if (!cols.some(Boolean) && rows.length) {           // headers not detected: first row is the header
      cols = rows[0].map(function (c) { return norm(cellText(c)); }); rows = rows.slice(1);
    }
    return rows.map(function (cells) {
      var o = {};
      cols.forEach(function (k, i) { if (k && !(k in o)) o[k] = cells[i] || null; });
      return o;
    });
  }
  function get(o, names) {
    for (var i = 0; i < names.length; i++) { var c = o[names[i]]; var t = cellText(c).trim(); if (t) return { text: t, cell: c }; }
    return { text: "", cell: null };
  }
  function txt(o, names) { return get(o, names).text; }

  // ---- dates and times, as the app reads them ----
  var MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  function parseDate(g) {
    var v = g.cell && g.cell.v;
    var m = typeof v === "string" && v.match(/^Date\((\d+),(\d+),(\d+)/);
    if (m) return ymd(+m[1], +m[2] + 1, +m[3]);
    var s = g.text;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return ymd(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))) return ymd(+m[3] < 100 ? 2000 + +m[3] : +m[3], +m[1], +m[2]);
    if ((m = s.match(/^(?:[a-z]+,?\s+)?([a-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})$/i))) {
      var mi = MONTHS.indexOf(m[1].toLowerCase()); if (mi >= 0) return ymd(+m[3], mi + 1, +m[2]);
    }
    if ((m = s.match(/^(\d{1,2})\s+([a-z]{3})[a-z]*\.?\s+(\d{4})$/i))) {
      var mj = MONTHS.indexOf(m[2].toLowerCase()); if (mj >= 0) return ymd(+m[3], mj + 1, +m[1]);
    }
    return null;
  }
  function ymd(y, mo, d) {
    if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return null;
    return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }
  function parseTime(g) {     // minutes after midnight, or null
    var v = g.cell && g.cell.v, m;
    if (typeof v === "string" && (m = v.match(/^Date\(\d+,\d+,\d+,(\d+),(\d+)/))) return +m[1] * 60 + +m[2];
    if (Array.isArray(v) && v.length >= 2) return v[0] * 60 + v[1];            // timeofday cells: [h, m, s]
    var s = g.text.toLowerCase().replace(/\./g, "");
    if ((m = s.match(/^(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*(am|pm)$/))) {
      var h = +m[1] % 12 + (m[3] === "pm" ? 12 : 0); return h * 60 + (+m[2] || 0);
    }
    if ((m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/))) return +m[1] * 60 + +m[2];
    return null;
  }
  function fmtTime(min) {
    if (min == null) return "";
    var h = Math.floor(min / 60), m = min % 60;
    return ((h + 11) % 12 + 1) + ":" + String(m).padStart(2, "0") + " " + (h < 12 ? "AM" : "PM");
  }
  function dateObj(d) { var p = d.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtDay(d, opts) { return dateObj(d).toLocaleDateString(undefined, opts); }
  function todayStr() { var n = new Date(); return ymd(n.getFullYear(), n.getMonth() + 1, n.getDate()); }

  // ---- reading the tabs into the trip ----
  function events(resp) {
    var rows = rowsOf(resp);
    if (rows.length && !("date" in rows[0]) && !("title" in rows[0])) throw new Error("headers");
    return rows.map(function (o) {
      var title = txt(o, ["title"]), dg = get(o, ["date"]);
      if (!title && !dg.text) return null;
      var date = parseDate(dg); if (!date) return null;
      var flight = txt(o, ["flight#", "flight", "flightnumber"]).replace(/\s+/g, "").toUpperCase();
      return {
        kind: "event", date: date, start: parseTime(get(o, ["starttime", "time"])), end: parseTime(get(o, ["endtime"])),
        type: txt(o, ["type"]) || (flight ? "Flight" : "Event"), title: title || "(untitled)",
        location: txt(o, ["location"]), address: txt(o, ["address"]), flight: flight,
        confirmation: txt(o, ["confirmation#", "confirmation"]), transport: txt(o, ["transport"]), notes: txt(o, ["notes"]),
        seat: txt(o, ["seat", "seats", "seatnumber", "seatno"]), cabin: txt(o, ["cabin", "class", "cabinclass", "travelclass"]),
        aircraft: txt(o, ["aircraft", "plane", "planetype", "aircrafttype"])
      };
    }).filter(Boolean);
  }
  function stays(resp) {
    var rows = rowsOf(resp);
    if (!rows.length) return [];
    if (!("checkindate" in rows[0])) throw new Error("not lodging");
    return rows.map(function (o) {
      var name = txt(o, ["lodgingname", "lodging", "hotelname", "name"]);
      var inD = parseDate(get(o, ["checkindate"])), outD = parseDate(get(o, ["checkoutdate"]));
      if (!name || !inD) return null;
      return {
        name: name, address: txt(o, ["address"]), inDate: inD, inTime: parseTime(get(o, ["checkintime"])),
        outDate: outD, outTime: parseTime(get(o, ["checkouttime"])), confirmation: txt(o, ["confirmation#", "confirmation"]),
        phone: txt(o, ["phone"]), notes: txt(o, ["notes"]), website: txt(o, ["website"])
      };
    }).filter(Boolean);
  }

  // ---- drawing ----
  var TYPE_ICON = { flight: "✈️", transport: "🚗", drive: "🚗", train: "🚆", bus: "🚌", boat: "⛴️", ferry: "⛴️",
    dinner: "🍽️", lunch: "🍽️", breakfast: "🍽️", food: "🍽️", restaurant: "🍽️", activity: "🎟️", tour: "🧭",
    wedding: "💍", checkin: "🏨", checkout: "🏨", hotel: "🏨", lodging: "🏨" };
  function icon(type) { return TYPE_ICON[norm(type)] || "📍"; }
  function mapsLink(q) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
  function dirLink(q) { return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(q); }
  function safeUrl(u) { return /^https?:\/\/[^\s"'<>]+$/i.test(u) ? u : ""; }

  function eventCard(e, isToday) {
    var place = e.address || e.location;
    var meta = [];
    if (e.location && e.location !== e.title) meta.push(esc(e.location));
    if (e.address && e.address !== e.location) meta.push(esc(e.address));
    var fl = [];
    if (e.flight) fl.push("Flight " + esc(e.flight));
    if (e.cabin) fl.push(esc(e.cabin));
    if (e.seat) fl.push("Seat " + esc(e.seat));
    if (e.aircraft) fl.push(esc(e.aircraft));
    if (fl.length) meta.push(fl.join(" · "));
    if (e.transport) meta.push("Getting there: " + esc(e.transport));
    if (e.confirmation) meta.push("Confirmation: " + esc(e.confirmation));
    var links = [];
    if (place) links.push('<a href="' + dirLink(place) + '" target="_blank" rel="noopener">Directions</a>');
    if (place) links.push('<a href="' + mapsLink(place) + '" target="_blank" rel="noopener">Map</a>');
    if (e.flight) links.push('<a href="https://www.google.com/search?q=' + encodeURIComponent(e.flight + " flight status") + '" target="_blank" rel="noopener">Flight status</a>');
    return '<article class="card' + (isToday ? " today" : "") + '">' +
      '<div class="time">' + (e.start != null ? esc(fmtTime(e.start)) : "All day") + (e.end != null ? "<small>to " + esc(fmtTime(e.end)) + "</small>" : "") + "</div>" +
      '<div class="body"><div class="title"><span class="type">' + icon(e.type) + " " + esc(e.type) + "</span>" + esc(e.title) + "</div>" +
      (meta.length ? '<div class="meta">' + meta.map(function (m) { return "<div>" + m + "</div>"; }).join("") + "</div>" : "") +
      (e.notes ? '<div class="notes">' + esc(e.notes) + "</div>" : "") +
      (links.length ? '<div class="links">' + links.join("") + "</div>" : "") + "</div></article>";
  }
  function stayItems(list) {     // check-in and check-out show up on their days, like the app's timeline
    var out = [];
    list.forEach(function (h) {
      out.push({ kind: "event", date: h.inDate, start: h.inTime, end: null, type: "Check-in", title: "Check in: " + h.name,
        location: "", address: h.address, flight: "", confirmation: h.confirmation, transport: "", notes: "", seat: "", cabin: "", aircraft: "" });
      if (h.outDate) out.push({ kind: "event", date: h.outDate, start: h.outTime, end: null, type: "Check-out", title: "Check out: " + h.name,
        location: "", address: h.address, flight: "", confirmation: "", transport: "", notes: "", seat: "", cabin: "", aircraft: "" });
    });
    return out;
  }
  function stayCard(h) {
    var nights = h.outDate ? Math.round((dateObj(h.outDate) - dateObj(h.inDate)) / 864e5) : null;
    var meta = [];
    meta.push(esc(fmtDay(h.inDate, { weekday: "short", month: "short", day: "numeric" })) + (h.inTime != null ? " " + esc(fmtTime(h.inTime)) : "") +
      (h.outDate ? " → " + esc(fmtDay(h.outDate, { weekday: "short", month: "short", day: "numeric" })) + (h.outTime != null ? " " + esc(fmtTime(h.outTime)) : "") : "") +
      (nights > 0 ? " · " + nights + (nights === 1 ? " night" : " nights") : ""));
    if (h.address) meta.push(esc(h.address));
    if (h.confirmation) meta.push("Confirmation: " + esc(h.confirmation));
    var links = [];
    if (h.address) links.push('<a href="' + dirLink(h.address) + '" target="_blank" rel="noopener">Directions</a>');
    var tel = h.phone.replace(/[^0-9+]/g, "");
    if (tel.length >= 6) links.push('<a href="tel:' + esc(tel) + '">Call</a>');
    var web = safeUrl(h.website);
    if (web) links.push('<a href="' + esc(web) + '" target="_blank" rel="noopener">Website</a>');
    return '<article class="card"><div class="time">🏨</div><div class="body"><div class="title">' + esc(h.name) + "</div>" +
      '<div class="meta">' + meta.map(function (m) { return "<div>" + m + "</div>"; }).join("") + "</div>" +
      (h.notes ? '<div class="notes">' + esc(h.notes) + "</div>" : "") +
      (links.length ? '<div class="links">' + links.join("") + "</div>" : "") + "</div></article>";
  }

  function render(evts, hotels) {
    var all = evts.concat(stayItems(hotels)).sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      var x = a.start == null ? -1 : a.start, y = b.start == null ? -1 : b.start; return x - y;
    });
    var today = todayStr();
    var byDay = {}, order = [];
    all.forEach(function (e) { if (!byDay[e.date]) { byDay[e.date] = []; order.push(e.date); } byDay[e.date].push(e); });
    if (!order.length && !hotels.length) {
      $("content").innerHTML = '<div class="state"><h2>Nothing planned yet</h2>The trip sheet has no events or stays yet. Check back soon.</div>';
      $("days").innerHTML = ""; return;
    }
    $("days").innerHTML = order.map(function (d) {
      return '<a href="#d' + d + '" class="' + (d === today ? "is-today" : "") + '">' + esc(fmtDay(d, { weekday: "short" })) +
        "<b>" + esc(fmtDay(d, { month: "short", day: "numeric" })) + "</b></a>";
    }).join("");
    var html = order.map(function (d) {
      var isToday = d === today;
      return '<section class="day" id="d' + d + '"><h2>' + esc(fmtDay(d, { weekday: "long", month: "long", day: "numeric", year: "numeric" })) +
        (isToday ? ' <span class="tag">Today</span>' : "") + "</h2>" +
        byDay[d].map(function (e) { return eventCard(e, isToday); }).join("") + "</section>";
    }).join("");
    if (hotels.length) html += '<h3 id="stays">Where we\'re staying</h3>' + hotels.map(stayCard).join("");
    $("content").innerHTML = html;
    if (!haveData && byDay[today] && !location.hash) {
      var el = document.getElementById("d" + today); if (el) el.scrollIntoView();
    }
    haveData = true;
    var first = order[0], last = order[order.length - 1];
    if (first && !tripName) $("tripName").textContent = "Trip " + fmtDay(first, { month: "short", day: "numeric" });
    if (first) $("from").textContent = (sender ? "Shared by " + sender + " · " : "") + fmtDay(first, { month: "short", day: "numeric" }) +
      (last !== first ? " – " + fmtDay(last, { month: "short", day: "numeric", year: "numeric" }) : ", " + dateObj(first).getFullYear());
  }

  function showError(kind) {
    if (haveData) { $("updated").textContent = "Couldn't refresh just now. Showing the last version."; return; }
    var msg = kind === "private"
      ? "<h2>This trip isn't shared yet</h2>Ask " + (sender ? esc(sender) : "the person who sent it") +
        " to share their trip sheet by link:<ol><li>Open the trip's Google Sheet.</li><li>Share &gt; General access &gt; <b>Anyone with the link</b> &gt; Viewer.</li><li>Tap Done, then reload this page.</li></ol>"
      : kind === "format"
      ? "<h2>This doesn't look like a KL Travel trip sheet</h2>The sheet needs an Events tab with Date and Title columns."
      : "<h2>Couldn't load the trip</h2>Check your connection and tap Refresh.";
    $("content").innerHTML = '<div class="state warn" role="alert">' + msg + "</div>";
  }

  function tick() {
    if (!lastLoaded) return;
    var m = Math.round((Date.now() - lastLoaded) / 60000);
    $("updated").textContent = "Updated " + (m < 1 ? "just now" : m === 1 ? "1 min ago" : m < 60 ? m + " min ago" : lastLoadedDate.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }));
  }
  var lastLoadedDate = null;

  function load() {
    if (loading) return; loading = true;
    $("refresh").disabled = true; $("refresh").textContent = "Refreshing…";
    var ev = gviz("Events").then(events);
    var lo = gviz("Lodging").then(stays).catch(function () { return gviz("Hotels").then(stays); }).catch(function () { return []; });
    Promise.all([ev, lo]).then(function (r) {
      render(r[0], r[1]); lastLoaded = Date.now(); lastLoadedDate = new Date(); $("bar").hidden = false; tick();
    }).catch(function (e) {
      var why = (e && (e.reason || e.message)) || "";
      showError(/access|denied|blocked|permission|login|sign/i.test(why) ? "private" : /headers|invalid_query|sheet/i.test(why) ? "format" : "network");
      $("bar").hidden = !haveData;
    }).then(function () { loading = false; $("refresh").disabled = false; $("refresh").textContent = "Refresh"; });
  }

  // ---- start ----
  if (tripName) { $("tripName").textContent = tripName; document.title = tripName + " · KL Travel"; }
  if (sender) $("from").textContent = "Shared by " + sender;
  if (!/^[A-Za-z0-9_-]{20,}$/.test(sheetId)) {
    $("tripName").textContent = "KL Travel";
    $("content").innerHTML = '<div class="state"><h2>Open a trip link</h2>This page shows a trip someone shared from the KL Travel app. ' +
      "Open the full link they sent you (it ends in <code>?s=…</code>).</div>";
    return;
  }
  $("refresh").addEventListener("click", load);
  load();
  setInterval(load, REFRESH_MS);
  setInterval(tick, 30000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && lastLoaded && Date.now() - lastLoaded > 60000) load();
  });
})();
</script>
</body>
</html>
